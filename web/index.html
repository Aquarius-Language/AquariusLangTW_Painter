<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>星泉塗鴉室</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23a9e7d8' d='M12 0L15 9L24 12L15 15L12 24L9 15L0 12L9 9Z'/%3E%3C/svg%3E">
<style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#081012;color:#e5eff7;font:15px system-ui}

</style>
<main id="surfaces"></main>
<pre hidden id="output" aria-live="polite"></pre>
<div id="error" role="alert" hidden></div>
